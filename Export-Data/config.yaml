# Frozen Fruit Export Analysis - Pipeline Configuration
# Supports: Peru, Ecuador

pipeline:
  inputs:
    # Country-specific XLSX files
    peru_xlsx: "../Veritrade_New_Peru.xlsx"
    ecuador_xlsx: "../Veritrade_New_Ecuador.xlsx"

    # Legacy Peru files (for backward compatibility)
    frozen_xlsx: "../data_sources/Veritrade_Frozen.xlsx"
    aseptic_xlsx: "../data_sources/Veritrade_Aseptic.xlsx"

    # Preprocessed CSV (after XLSX conversion)
    combined_csv: "data/veritrade_combined.csv.gz"

    # Enriched data (after NLP parsing)
    enriched_csv: "data/veritrade_combined_enriched.csv.gz"

  outputs:
    database: "data/exports.db"
    export_summary: "data/export_summary.json"
    data_validation: "data/data_validation.json"

  processing:
    xlsx_header_row: 5  # Row index where actual headers start
    ytd_start_date: "2024-10-01"
    ytd_end_date: "2025-10-31"
    enable_quality_filters: true
    iqr_multiplier: 1.5
    min_shipment_mt: 0.1

# Country-specific configurations
countries:
  peru:
    source_file: "../Veritrade_New_Peru.xlsx"
    expected_columns: 33
    column_mapping:
      quantity: "Qty 1"
      quantity_unit: "Unit 1"
      tax_id: "Tax ID"
      destination_port: "Destination Port"
      fob_unit: "U$ FOB Unit 1"

  ecuador:
    source_file: "../Veritrade_New_Ecuador.xlsx"
    expected_columns: 51
    column_mapping:
      quantity: "Qty"
      quantity_unit: "Unit"
      tax_id: "Tax Id"
      destination_port: "Unloading Port"
      fob_unit: "U$ FOB Unit"
    extra_columns:
      - "Country of Origin"
      - "ETD"
      - "Vessel"
      - "U$ CFR Tot"
      - "U$ CIF Tot"
      - "U$ Freight Tot"
      - "U$ Insurance Tot"

metadata:
  peru:
    record_count: 21476
    column_count: 33
  ecuador:
    record_count: 25283
    column_count: 51
  # Legacy metadata
  frozen:
    file: "Veritrade_Frozen.xlsx"
    record_count: 14279
    hts_code: "081190"
  aseptic:
    file: "Veritrade_Aseptic.xlsx"
    record_count: 16465
    hts_codes: ["2009", "2008", "2007"]
